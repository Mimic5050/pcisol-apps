<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email confirmed · Homezio</title>
  <link rel="icon" href="icon.svg" />
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --accent: #047857; --card: #fff; --line: #e7e5e4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --accent: #34d399; --card: #1c1917; --line: #292524; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 64px 16px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.6rem; margin: 16px 0 8px; }
    p { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 24px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <img src="icon.svg" alt="" />
  <h1>Your email is confirmed</h1>
  <p>Go back to Homezio and sign in with the same email and password.</p>
  <div class="card"><p>In the app: <strong>Settings → Sync → I already have an account</strong>.</p></div>
  <p style="margin-top:32px;font-size:14px">Homezio by PCI Solutions · <a href="support.html">Support</a></p>
</main>
</body>
</html>
